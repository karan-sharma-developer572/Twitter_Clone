<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Twitter</title>
        <link rel="stylesheet" href="css/output.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    </head>
    <body class="bg-black text-white">
        <div class=" flex container mx-auto">
            <div class="First w-full">
                <div class="logo invert">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class=" w-8 r-4qtqp9 r-yyyyoo r-dnmrzs r-bnwqim r-lrvibr r-m6rgpd r-lrsllp r-1nao33i r-16y2uox r-8kz0gk"><g><path d="M21.742 21.75l-7.563-11.179 7.056-8.321h-2.456l-5.691 6.714-4.54-6.714H2.359l7.29 10.776L2.25 21.75h2.456l6.035-7.118 4.818 7.118h6.191-.008zM7.739 3.818L18.81 20.182h-2.447L5.29 3.818h2.447z"></path></g></svg>

                <div class="slidebar flex justify-end">
                    <ul class="flex flex-col text-xl space-y-3">
                        <li class=" flex justify-start items-center gap-3">
                            <span class="material-symbols-outlined">home</span>
                            <span>Home</span>                           
                        </li>
                        <li class=" flex justify-start items-center gap-3">
                            <span class="material-symbols-outlined">search</span>
                            <span>Explore</span>                          
                        </li>
                        <li class=" flex justify-start items-center gap-3">
                            <span class="material-symbols-outlined">notifications</span>
                            <span>Notification</span>                   
                        </li>
                        <li class=" flex justify-start items-center gap-3">
                            <span class="material-symbols-outlined">person_add</span>
                            <span>Follow</span>
                                                  
                        </li>
                        <li class=" flex justify-start items-center gap-3">
                            <span class="material-symbols-outlined">chat_bubble</span>
                            <span>Chat</span>                            
                        </li>
                        <li class=" flex justify-start items-center gap-3">
                            <span class="material-symbols-outlined">do_not_disturb</span>
                            <span>Grok</span>                            
                        </li>
                        <li class=" flex justify-start items-center gap-3">
                            <span class="material-symbols-outlined">person</span>
                            <span>Profile</span>                           
                        </li>
                        <li class=" flex justify-start items-center gap-3">
                            <span class="material-symbols-outlined">pending</span>
                            <span>More</span>                            
                        </li>
                        
                        
                        
                    </ul>
                    
                </div>
                
            </div>
            <div class="Second w-full border-[1px] border-x-white border-y-black">B</div>
            <div class="Third w-full">C</div>
        </div>
